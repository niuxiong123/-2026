name: 每日抓取宏观数据

# 无需服务器、无需备案、永久免费：GitHub 的电脑每个工作日帮你跑一次脚本
# 时间：UTC 6:00 = 北京时间 14:00（周一到周五，含周五）
#   —— 提前30分钟触发，确保 14:30 前宏观数据已写入 main 且 GitHub Pages 构建完成；
#      用户 14:30 收盘前打开网页即为当日最新（趋势/流动/情绪/汇率/美债/广度/ERP/PE 由页面加载时实时拉取，不依赖此任务）。
#   —— GitHub Actions 的 cron 固定按 UTC 计时，无法设时区，故手动换算（北京=UTC+8）。
#   —— 周一到周五 = 1-5，周五(5)已含，必跑；不自动识别中国法定调休假日（局限见 AI_RULES.md）。
on:
  schedule:
    - cron: "0 6 * * 1-5"      # 工作日 14:00 北京：主更新（保持 14:30 前完成）
    - cron: "30 6 * * 0,6"     # 周末 14:30 北京：轻量更新（仅刷新数据+存快照，不告警）
  workflow_dispatch:        # 允许在网页上点按钮手动跑一次

permissions:
  contents: write           # 需要写回仓库（提交 macro.json）

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 装依赖
        run: pip install --quiet akshare requests

      - name: 抓数据+算仓位+告警
        env:
          NX_LIGHT: ${{ github.event.schedule == '30 6 * * 0,6' && '1' || '0' }}
        run: python3 daily_job.py

      - name: 自检 verify（校验不过就不推送）
        run: |
          node tests/verify_site.js
          echo "自检通过，允许推送"

      - name: 把新数据存回仓库
        run: |
          git config user.name  "niuxiong-bot"
          git config user.email "niuxiong-bot@users.noreply.github.com"
          git add -f docs/macro.json niuxiong.db
          if git diff --quiet && git diff --staged --quiet; then
            echo "数据无变化，不提交"
          else
            git commit -m "data: $(date -u +%F)"
            git push
          fi
