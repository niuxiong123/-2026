# 宏观数据每日采集 + 温度序列记录（第⑤⑥步 item①/⑤）
# 流程：akshare 采集 macro.json → node 直跑 compute.js 记录当日温度 → 一并写回仓库
# 说明：akshare 接口偶有区域性失败，collect_macro.py 缺一不写整份 + 最小成功数护栏；
#       温度计算不复制逻辑：温度直跑线上 compute.js。
# B5（2026-10-24）：backtest.json 旧管线更新已停止——旧温度模型 IC≈0、展示层已移除，
#   update_backtest.py 不再由本 workflow 调用；backtest.json 冻结在最后状态，仅作历史档案
#   供 fetcher.js 静态读取。如需恢复，取消下方注释并同步解除脚本内的弃用软锁。
name: macro-daily

on:
  schedule:
    - cron: '0 23 * * *'   # 每天 07:00（北京时间），早于行情更新前跑完
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 akshare
        run: pip install akshare

      - name: 采集宏观真实字段
        run: python scripts/collect_macro.py

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 记录当日温度（直跑 compute.js）
        run: node scripts/compute_temp.mjs

      # B5（2026-10-24）：旧温度模型回测序列停更，此步已停用（见文件头注释）
      # - name: 回测序列按月追加（双成熟才落库，不碰历史行）
      #   run: python scripts/update_backtest.py

      - name: 写回仓库（先 rebase 再推，失败重试一次）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/niuxiong-zijiantai/data/macro.json docs/niuxiong-zijiantai/data/temp_daily.json
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(data): 宏观每日采集 + 温度序列记录 [skip ci]"
          git pull --rebase origin main || { git rebase --abort; exit 1; }
          git push origin HEAD:main || { sleep 5; git pull --rebase origin main && git push origin HEAD:main; } || exit 1

      - name: 失败时开 issue 告警（先查重防刷屏）
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="⚠️ macro-daily 工作流失败（${{ github.run_number }}）"
          EXISTING=$(gh issue list --state open --search "macro-daily 工作流失败" --json number --jq 'length')
          if [ "$EXISTING" = "0" ]; then
            gh issue create --title "$TITLE" --body "macro-daily（宏观采集+温度记录）于 ${{ github.event.head_commit.timestamp }} 失败。请查看 Actions run #${{ github.run_number }}：多数是 akshare 接口区域性失败，collect_macro.py 会保留基线不写回；若连续多天失败需人工检查。"
          else
            echo "已有未关闭的告警 issue，跳过创建"
          fi
